description: Tizona Therapeutics is a clinical-stage biotechnology company focused on developing
  first-in-class cancer immunotherapies by translating novel scientific insights into new medicines.
  Its lead program, TTX-080, is a first-in-class HLA-G antagonist in clinical trials for advanced solid
  tumors. Tizona is a portfolio company of Canaan Partners. As a pharmaceutical drug-development company
  it publishes no public developer API, developer portal, SDKs, or other machine-readable API surface;
  this profile is retained as a network company record rather than an API provider.
